version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: heladeria-postgres-test
    environment:
      POSTGRES_DB: heladeria_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - ./tests/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
