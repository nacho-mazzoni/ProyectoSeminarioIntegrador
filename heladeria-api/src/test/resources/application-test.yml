server:
  port: 0

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///heladeria_test?TC_INITSCRIPT=init-test.sql
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  jwt-secret: test-jwt-secret-not-used-in-tests
