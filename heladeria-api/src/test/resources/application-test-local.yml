server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heladeria_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  sql:
    init:
      mode: always
      schema-locations: file:./tests/init/01-schema.sql
      data-locations: file:./tests/init/02-test-seed.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  jwt-secret: test-jwt-secret
