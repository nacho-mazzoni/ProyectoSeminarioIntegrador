services:
  postgres:
    image: postgres:16-alpine
    container_name: heladeria-postgres
    environment:
      POSTGRES_DB: heladeria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./heladeria-api/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./heladeria-api
      dockerfile: Dockerfile
    container_name: heladeria-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./heladeria-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: heladeria-web
    ports:
      - "3000:3000"
    depends_on:
      - api
